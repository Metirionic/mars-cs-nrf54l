# UART-only stream test: no Bluetooth, no Rust serializer, no shell.
# The console stays on the DK default (uart30 -> VCOM0) so the COBS UART
# (uart20 -> VCOM1) is the only thing on the wire under test.

CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# Zephyr's streaming COBS encoder (lib/utils/cobs.c) is gated on this; it also
# selects NET_BUF, which the cobs_encode()/cobs_decode() net_buf wrappers need.
CONFIG_COBS=y

CONFIG_LOG=y
# Mirror the production apps: minimal mode prints synchronously through printk
# to the console. The deferred log thread with the UART backend leaves
# LOG_BACKEND_UART_OUTPUT_DEFAULT=0, which swallows every message -- including
# the fatal-error report, so a faulting image looks like a silent hang.
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_MAIN_STACK_SIZE=2048
