# Würth Elektronik Ophelia-IV MiniEV board console config. The MiniEV exposes a
# single UART — uart20, the COBS ranging stream (cobs-uart) — on header CON4
# (silk "TTL-232R-3V3 (3.3V Logic)") for an external USB-to-serial adapter. The
# module's uart30 pins (P0.00/P0.01) land on unmounted GPIO headers, so there is
# no console/shell UART: the console (log output) runs over Segger RTT via an
# external J-Link debug probe, matching the minew_me54be01.conf,
# raytac_an54lv_k15.conf and insight_isp2454.conf pattern.
#
# The MiniEV is the second carrier that builds on its own NCS board def
# (ophelia4ev/nrf54l15/cpuapp, after the nrf54l15tag) — and the board def routes
# ALL five console chosen nodes (zephyr,console / shell-uart / uart-mcumgr /
# bt-mon-uart / bt-c2h-uart) to uart20 itself, i.e. onto the COBS stream. The
# overlay /delete-property/'s them; this conf must also explicitly disable
# CONFIG_UART_CONSOLE (the ophelia4ev defconfig sets CONFIG_UART_CONSOLE=y and
# CONFIG_CONSOLE=y) — otherwise zephyr/drivers/console/uart_console.c references
# the (deleted) zephyr,console node (DEVICE_DT_GET(DT_CHOSEN(zephyr_console)))
# and the build fails. CONFIG_SERIAL is already board-level (defconfig) — the
# uart20 cobs-uart device the initiator's serialize.c acquires instantiates.
# These lines mirror Zephyr's rtt-console snippet (CONFIG_USE_SEGGER_RTT is the
# dependency CONFIG_RTT_CONSOLE requires).
#
# 32 K clock: the ophelia4ev defconfig selects the internal RC oscillator
# (CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y) — deliberate, since the MiniEV ships
# without an LFXO crystal (UM §5.6.2). Do not override to XTAL here without the
# crystal rework.
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
